#======================= Global Settings =======================
[global]
   workgroup = WORKGROUP
   netbios name = LS210
   server string = LS210 NAS
   server role = standalone server
   security = user

   # Unknown/blank credentials fall through to the guest account rather than
   # being rejected, which is what keeps the open [downloads] share working.
   map to guest = Bad User

   # SMB1 is obsolete and disabled by default in current Windows and macOS;
   # refusing it removes a large, well-known attack surface and costs nothing
   # since every client this NAS will meet speaks SMB2 or better.
   server min protocol = SMB2_10

   # This box is a single ~800MHz core, so keep the network path cheap:
   # sendfile hands file data straight from page cache to socket without
   # bouncing it through userspace, which is the single biggest win for the
   # large model files being copied here.
   use sendfile = yes
   socket options = TCP_NODELAY IPTOS_LOWDELAY

   # No printer is attached, and probing for one slows startup and opens
   # services that would otherwise sit unused.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # The root filesystem is small and has crashed this box when filled, so
   # logging is capped tightly (1MB per file).
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   pam password change = yes

   idmap config * : backend = tdb

#======================= Share Definitions =======================

[downloads]
   comment = LS210 storage (Fetcher downloads and Files)
   path = /var/downloads
   browseable = yes
   read only = no
   guest ok = yes

   # Everything created over SMB is owned by debian - the same account the
   # Fetcher and Files web apps run as. Without this, files copied in from a
   # PC land owned by "nobody" and the web apps cannot rename or overwrite
   # them, so the same file behaves differently depending on how it arrived.
   force user = debian
   force group = debian
   create mask = 0644
   directory mask = 0755
